[project]
name = "td"
version = "0.1.0"
description = "test-dashboard PoC: 파이프라인 데이터 가공과 사이트 생성"
requires-python = ">=3.12"
dependencies = [
  "jinja2",
  "boto3",
  "jsonschema",
  "pyyaml",
  "rdflib",
  "pyshacl",
  "pytest",
  "playwright",
  "neo4j>=6.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["td"]
