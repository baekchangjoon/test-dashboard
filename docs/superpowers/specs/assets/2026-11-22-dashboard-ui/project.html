  document.getElementById("meta").textContent = "커밋 " + D.commit.slice(0, 7) + " · 최근 실행 " + D.startedAt.replace("T", " ").replace("Z", " UTC") + " · 실행 " + D.runs.length + "회";
  document.getElementById("headline").innerHTML = "기존 테스트는 모두 통과하지만, 테스트가 지키는 코드는 <em>" + pct(bb.line) + "</em>입니다";
  document.getElementById("lede").textContent = "Sonar 게이트는 통과했고 취약점 " + sq.vuln + "건(차단 " + sq.vulnBlocker + ", 심각 " + sq.vulnCritical + ")이 열려 있습니다. 위험 점수 1위는 " + D.hotspots[0].name + "입니다. 이번 변경 범위에서는 테스트 " + D.tia.indexedTests + "개 중 " + D.tia.selected + "개를 다시 돌려야 합니다.";

  function head(q, guide){ return '<div class="q"><h2>' + q + '</h2></div><div class="guide"><b>이 탭 읽는 법</b> · ' + guide + "</div>"; }
  function hotList(n){
    var max = D.hotspots[0].score;
    return '<ol class="bars">' + D.hotspots.slice(0, n).map(function(h, i){
      return '<li><span class="n">' + (i + 1) + '</span><span class="nm" title="' + esc(h.file) + '">' + esc(h.name) + '</span><span class="v">' + h.score.toFixed(1) + '</span><span class="tr"><i style="width:' + (h.score / max * 100).toFixed(1) + '%"></i></span></li>';
    }).join("") + "</ol>";
  }
  function stageStrip(){
    var s = D.stages.filter(function(x){ return x.id === stageSel; })[0];
    return '<div class="stages">' + D.stages.map(function(x){
      return '<button type="button" data-stage="' + x.id + '" aria-pressed="' + (x.id === stageSel) + '" style="--w:' + Math.max(1, Math.sqrt(x.sec + 1)).toFixed(2) + '" title="' + esc(x.label) + " · " + dur(x.sec) + '">' + x.id.slice(1) + "</button>";
    }).join("") + '</div><div class="stagebox"><b>' + s.id + " " + esc(s.label) + "</b> · 통과 · " + dur(s.sec) + (s.note ? " · " + esc(s.note) : "") + "</div>";
  }
  var PAGES = {
    overview: function(){
      var runsLine = D.runs.map(function(r){ return r.line; }).reverse(), runsPass = D.runs.map(function(r){ return r.pass; }).reverse();
      var c = 2 * Math.PI * 45, share = D.tia.selected / D.tia.indexedTests;
      return head("이 과제는 지금 어떤 상태인가", "위 문장이 결론이고, 아래 다섯 칸이 근거입니다. 칸 아래 작은 선은 최근 " + D.runs.length + "회 실행의 흐름입니다. 더 알고 싶은 항목은 위 탭에서 들어갑니다.") +
      '<div class="grid g5">' +
        '<div class="card kpi" style="--c:var(--good)"><div><span>기존 테스트 통과율</span><b>' + pct(D.kpis.pass, 0) + "</b><small>블랙박스 " + bb.tc + "개</small></div>" + spark(runsPass) + "</div>" +
        '<div class="card kpi" style="--c:var(--warn)"><div><span>테스트가 지키는 코드(라인)</span><b>' + pct(bb.line) + "</b><small>실행만 된 코드까지 " + pct(bb.aggLine) + "</small></div>" + spark(runsLine) + "</div>" +
        '<div class="card kpi" style="--c:var(--good)"><div><span>Sonar 품질 게이트</span><b>통과</b><small>새 위반 0건</small></div></div>' +
        '<div class="card kpi" style="--c:var(--crit)"><div><span>열린 취약점</span><b>' + sq.vuln + "</b><small>차단 " + sq.vulnBlocker + " · 심각 " + sq.vulnCritical + " · 주요 " + sq.vulnMajor + "</small></div></div>" +
        '<div class="card kpi" style="--c:var(--warn)"><div><span>변경 시 다시 돌릴 테스트</span><b>' + D.tia.selected + " / " + D.tia.indexedTests + "</b><small>정밀 선별 0개</small></div></div>" +
      "</div>" +
      '<div class="grid g2">' +
        '<div class="card"><h3>먼저 손볼 곳 <a href="#hotspot" data-tab="hotspot">위험 지점 전체 →</a></h3>' + hotList(5) + '<p class="sub dim">위험 점수 = 복잡도 × 최근 변경 압력 × 커버리지 배수</p></div>' +
        '<div class="card"><h3>이번 변경의 영향 <a href="' + R + 'tia/tia.html">TIA 리포트 열기 →</a></h3><div class="ringrow"><div class="ring"><svg viewBox="0 0 110 110"><circle class="bg" cx="55" cy="55" r="45"/><circle class="fg" cx="55" cy="55" r="45" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (c * (1 - share)).toFixed(1) + '"/></svg><div><b>' + pct(share, 0) + "</b><span>다시 실행</span></div></div>" +
          '<p class="sub">최근 10개 커밋 범위에서 테스트 ' + D.tia.indexedTests + "개 중 <b>" + D.tia.selected + "개</b>가 선택됐습니다. 전부 " + '"안전하게 넓게 고른" 선택이고, 변경된 코드와 정확히 이어진 선별은 0개입니다.</p></div></div>' +
      "</div>" +
      '<div class="card"><h3>파이프라인 14단계 <span class="dim" style="font-weight:400;font-size:12.5px">전체 ' + dur(D.totalSec) + " · 칸 너비는 걸린 시간</span></h3>" + stageStrip() + "</div>" +
      '<div class="card"><h3>리포트 바로가기</h3><div class="links">' + D.reports.map(function(l){ return '<a href="' + R + l[1] + '">' + esc(l[0]) + "<small>" + esc(l[2]) + "</small></a>"; }).join("") + "</div></div>";
    },
    tests: function(){
      return head("어떤 테스트가 돌았고 얼마나 통과했나", "위는 사람이 관리하는 기존 테스트, 아래는 AI가 생성한 E2E 시나리오입니다. 생성 시나리오의 실패는 제품 결함이 아니라 생성된 테스트의 품질 문제일 수 있습니다.") +
      '<div class="grid g3">' +
        '<div class="card kpi" style="--c:var(--good)"><div><span>기존 블랙박스 테스트</span><b>' + bb.tc + "개</b><small>통과율 " + pct(D.kpis.pass, 0) + " · 커버리지가 귀속된 테스트 " + bb.attributed + "개</small></div></div>" +
        '<div class="card kpi"><div><span>생성된 E2E 시나리오</span><b>' + D.gens.reduce(function(a, g){ return a + g.scenarios; }, 0) + "개</b><small>3가지 방식 × 3회 반복 = " + D.gens.length + "묶음</small></div></div>" +
        '<div class="card kpi" style="--c:var(--warn)"><div><span>생성 시나리오 통과율</span><b>' + pct(D.gens.reduce(function(a, g){ return a + g.passed; }, 0) / D.gens.reduce(function(a, g){ return a + g.scenarios; }, 0)) + "</b><small>컴파일 실패 0 · 정의 안 된 스텝 0</small></div></div>" +
      "</div>" +
      '<div class="card"><h3>생성 묶음별 결과</h3><div class="legend"><span><i style="background:var(--good)"></i>통과</span><span><i style="background:var(--crit)"></i>실패</span></div><div class="scroll"><table><thead><tr><th>방식</th><th>묶음</th><th class="n">시나리오</th><th>통과 / 실패</th><th class="n">통과율</th><th></th></tr></thead><tbody>' +
        D.gens.map(function(g){
          return '<tr><td><span class="arm a-' + g.arm + '">' + g.arm + '</span></td><td class="mono">' + esc(g.id) + '</td><td class="n">' + g.scenarios + '</td><td><div class="stack" title="통과 ' + g.passed + " · 실패 " + g.failed + '"><i class="p" style="width:' + (g.passed / g.scenarios * 100) + '%"></i><i class="f" style="width:' + (g.failed / g.scenarios * 100) + '%"></i></div></td><td class="n">' + pct(g.passed / g.scenarios) + '</td><td><a href="' + R + "cucumber/" + esc(g.id) + '/index.html">Cucumber 리포트</a></td></tr>';
        }).join("") + "</tbody></table></div></div>";
    },
    coverage: function(){
      return head("테스트가 코드의 얼마를 지키는가", "진한 막대는 그 테스트가 직접 실행한 것으로 확인된 코드(귀속), 연한 막대는 준비 과정까지 포함해 실행된 코드(집계)입니다. 둘의 차이가 크면 검증 없이 지나가기만 한 코드가 많다는 뜻입니다.") +
      '<div class="card"><h3>테스트 묶음별 라인 커버리지 <a href="' + R + 'coverage/coverage.html">테스트별 상세 열기 →</a></h3><div class="legend"><span><i style="background:var(--accent)"></i>귀속</span><span><i style="background:color-mix(in srgb,var(--accent) 40%,var(--sunk))"></i>집계</span></div><div class="scroll"><table><thead><tr><th>묶음</th><th class="n">테스트</th><th>라인</th><th class="n">귀속</th><th class="n">집계</th><th class="n">분기(귀속)</th></tr></thead><tbody>' +
        D.coverage.map(function(s){
          return '<tr><td class="mono">' + esc(s.name) + '</td><td class="n">' + s.tc + '</td><td><div class="pair"><div class="a"><i style="width:' + s.line * 100 + '%"></i></div><div class="g"><i style="width:' + s.aggLine * 100 + '%"></i></div></div></td><td class="n"><b>' + pct(s.line) + '</b></td><td class="n">' + pct(s.aggLine) + '</td><td class="n">' + pct(s.branch) + "</td></tr>";
        }).join("") + "</tbody></table></div></div>";
    },
    hotspot: function(){
      return head("어디부터 손봐야 하나", "점수가 높을수록 복잡하고, 최근에 자주 바뀌었고, 테스트가 덜 지키는 코드입니다. 위에서부터 테스트를 보강하면 됩니다.") +
      '<div class="grid g2"><div class="card"><h3>위험 점수 상위 10개 메서드 <a href="' + R + 'hotspot/hotspots.html">hotspot 리포트 열기 →</a></h3>' + hotList(10) + "</div>" +
      '<div class="card"><h3>hotspot 지도</h3><p class="sub">hotspot-analysis의 새 리포트(패키지 › 파일 › 클래스 › 메서드를 원으로 그리고 눌러 들어가는 지도)가 이 자리에 들어옵니다. 지금 게시된 리포트는 도구 버전이 0.1.6이라 표만 있습니다.</p><p class="sub dim">도구 버전을 올리면 지도와 점수 계산 과정, 소스 링크가 함께 실립니다.</p></div></div>';
    },
    quality: function(){
      var sev = ["BLOCKER","CRITICAL","MAJOR","MINOR","INFO"], sevKo = {BLOCKER:"차단", CRITICAL:"심각", MAJOR:"주요", MINOR:"경미", INFO:"참고"};
      var types = [["VULNERABILITY","취약점","var(--crit)"],["BUG","버그","var(--warn)"],["CODE_SMELL","코드 스멜","var(--accent)"]];
      var max = Math.max.apply(null, Object.keys(sq.matrix).map(function(k){ return sq.matrix[k]; }));
      return head("정적 분석은 무엇을 말하나", "게이트는 새로 추가된 위반만 봅니다. 그래서 게이트가 통과여도 이미 쌓여 있는 취약점은 아래 표에 남아 있습니다.") +
      '<div class="grid g5">' +
        '<div class="card kpi" style="--c:var(--good)"><div><span>품질 게이트</span><b>통과</b><small>새 위반 0건</small></div></div>' +
        '<div class="card kpi" style="--c:var(--crit)"><div><span>취약점</span><b>' + sq.vuln + "</b><small>보안 등급 E</small></div></div>" +
        '<div class="card kpi" style="--c:var(--warn)"><div><span>버그</span><b>' + sq.bugs + "</b><small>신뢰성 등급 C</small></div></div>" +
        '<div class="card kpi"><div><span>코드 스멜</span><b>' + sq.smells + "</b><small>유지보수 등급 A</small></div></div>" +
        '<div class="card kpi"><div><span>Sonar 커버리지</span><b>' + sq.cov + "%</b><small>코드 " + sq.ncloc.toLocaleString() + "줄</small></div></div>" +
      "</div>" +
      '<div class="card"><h3>열린 이슈 ' + sq.total + '건 <a href="' + esc(sq.url) + '">SonarQube에서 열기 →</a></h3><div class="scroll"><table class="heat"><thead><tr><th>종류</th>' + sev.map(function(s){ return '<th class="n" style="text-align:center">' + sevKo[s] + "</th>"; }).join("") + "</tr></thead><tbody>" +
        types.map(function(t){ return "<tr><td>" + t[1] + "</td>" + sev.map(function(s){ var v = sq.matrix[t[0] + "/" + s] || 0; return '<td class="h" style="--c:' + t[2] + ";--v:" + (v ? 0.25 + 0.75 * v / max : 0).toFixed(2) + '">' + (v || '<span class="dim">·</span>') + "</td>"; }).join("") + "</tr>"; }).join("") +
        '</tbody></table></div><p class="sub dim">보안 검토가 필요한 지점 1곳: CSRF 보호를 끈 설정(SecurityConfig).</p></div>';
    },
    gen: function(){
      var th = D.compare.thresholds;
      function cell(v, ok){ return '<td class="n ' + (ok == null ? "" : ok ? "ok" : "bad") + '">' + v + "</td>"; }
      return head("AI가 만든 테스트는 쓸 만한가", "코드 구조 정보를 주지 않은 방식(base)과 준 방식 둘(jqa, owl)을 3회씩 돌린 평균입니다. 기준을 넘은 칸은 초록, 못 넘은 칸은 빨강입니다.") +
      '<div class="card" style="border-left:4px solid var(--warn)"><h3>판정: ' + esc(D.compare.generation) + " · " + esc(D.compare.effect) + ' <a href="' + R + 'compare/compare.html">비교 리포트 열기 →</a></h3><p class="sub">어느 방식도 통과율 70%와 엔드포인트 도달 80% 기준을 넘지 못했고, 방식 사이의 차이도 반복 간 편차 안에 있습니다. 3회 반복이라 탐색적 관찰입니다.</p></div>' +
      '<div class="card"><div class="scroll"><table><thead><tr><th>방식</th><th class="n">시나리오</th><th class="n">컴파일<br><span class="dim">' + esc(th.compile) + '</span></th><th class="n">통과율<br><span class="dim">' + esc(th.passed) + '</span></th><th class="n">엔드포인트 도달<br><span class="dim">' + esc(th.endpoint) + '</span></th><th class="n">라인 커버리지</th><th class="n">토큰</th><th class="n">생성 시간</th></tr></thead><tbody>' +
        D.compare.arms.map(function(a){
          return '<tr><td><span class="arm a-' + a.arm + '">' + a.arm + "</span></td>" + cell(a.scenarios.toFixed(1)) + cell(pct(a.compile, 0), a.compile >= 0.9) + cell(pct(a.passed), a.passed >= 0.7) + cell(pct(a.endpoint), a.endpoint >= 0.8) + cell(pct(a.line)) + cell(Math.round(a.tokens).toLocaleString()) + cell(dur(Math.round(a.seconds))) + "</tr>";
        }).join("") + "</tbody></table></div></div>";
    },
    runs: function(){
      return head("언제 무엇이 돌았나", "한 줄이 한 번의 실행입니다. 작은 칸 14개는 파이프라인 단계이고 비어 있는 칸은 그 실행에서 건너뛴 단계입니다.") +
      '<div class="card"><div class="scroll"><table><thead><tr><th>실행</th><th>시작(UTC)</th><th>단계</th><th class="n">통과율</th><th class="n">귀속 라인</th><th>Sonar</th></tr></thead><tbody>' +
        D.runs.map(function(r){
          return '<tr><td class="mono"><a href="/suts/petclinic/runs/' + esc(r.id) + '/index.html">' + esc(r.id.slice(0, 16)) + '…</a></td><td>' + esc(r.at.replace("T", " ").replace("Z", "")) + '</td><td><div class="ministages">' + r.stages.map(function(s){ return s ? "<i></i>" : '<i class="x"></i>'; }).join("") + '</div></td><td class="n">' + pct(r.pass, 0) + '</td><td class="n">' + pct(r.line) + "</td><td>" + (r.gate === "OK" ? "통과" : esc(r.gate || "—")) + "</td></tr>";
        }).join("") + "</tbody></table></div></div>";
    }
  };
  function render(){
    document.getElementById("tabs").innerHTML = TABS.map(function(t){ return '<button type="button" role="tab" data-tab="' + t[0] + '" aria-selected="' + (t[0] === tab) + '">' + t[1] + "</button>"; }).join("");
    document.getElementById("page").innerHTML = PAGES[tab]();
  }
  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-tab],[data-stage]");
    if (!t) return;
    if (t.dataset.stage) stageSel = t.dataset.stage;
    else { e.preventDefault(); tab = t.dataset.tab; history.replaceState(null, "", "#" + tab); window.scrollTo(0, 0); }
    render();
  });
  render();
})();
</script>
</body></html>
