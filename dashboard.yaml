    sut: petclinic                  # 파이프라인을 돌리는 과제만
  - name: hotspot-analysis
    repo: baekchangjoon/hotspot-analysis
  - name: test-impact-analysis
    repo: baekchangjoon/test-impact-analysis
  - name: graph-rag-test-generator
    repo: baekchangjoon/graph-rag-test-generator
  - name: kn-estimator
    repo: baekchangjoon/kn-estimator
  - name: spring-chaos-harness
    repo: baekchangjoon/spring-chaos-harness
  - name: CEF-Browser
    repo: baekchangjoon/CEF-Browser
  - name: atlassian-browser-skills
    repo: baekchangjoon/atlassian-browser-skills
  - name: ManualTestCoverageMeasurement
    repo: baekchangjoon/ManualTestCoverageMeasurement
  - name: CEF-Browser-Playwright
    repo: baekchangjoon/CEF-Browser-Playwright
  - name: baekchangjoon
    repo: baekchangjoon/baekchangjoon
  - name: mock-oauth2-server-poc
    repo: baekchangjoon/mock-oauth2-server-poc
  - name: sonarqube-ai-agent
    repo: baekchangjoon/sonarqube-ai-agent
  - name: token-stats
