# S01 수량 게이트의 기대값: 블랙박스 IT의 @Test 수(기준 커밋 b6f9393). JUnit XML 총 TC 수와 .exec 수가 이 값과 같아야 한다.
blackbox:
  total: 35
  classes:
    AuthApiBlackBoxIT: 4
    ConcurrencyBlackBoxIT: 2
    OwnerApiBlackBoxIT: 8
    PetApiBlackBoxIT: 5
    ReservationApiBlackBoxIT: 6
    TokenRejectionBlackBoxIT: 5
    VetApiBlackBoxIT: 5
# pjacoco는 HttpServlet#service에서만 테스트를 귀속한다. 보안 필터 체인에서 거부되는 TC는 .exec가 없다(구조적).
expected_exec: 27
no_attribution:
  reason: "rejected in security filter chain before HttpServlet#service; pjacoco attributes at servlet layer"
  tests:
    - OwnerApiBlackBoxIT#listingOwnersRequiresAuthentication
    - PetApiBlackBoxIT#readingPetsRequiresAuthentication
    - ReservationApiBlackBoxIT#listingRequiresAuthentication
    - VetApiBlackBoxIT#listingVetsRequiresAuthentication
    - TokenRejectionBlackBoxIT#garbageTokenIsRejected
    - TokenRejectionBlackBoxIT#malformedTokenStructureIsRejected
    - TokenRejectionBlackBoxIT#tokenSignedWithWrongSecretIsRejected
    - TokenRejectionBlackBoxIT#tokenWithoutBearerSchemeIsRejected
