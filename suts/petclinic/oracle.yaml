# 규칙 오라클(평가 전용, 설계 §6.12). 생성 입력(번들)에 들어가면 안 된다: td.bundle check_content가 각 description을
# 정규화해 번들 텍스트에 부분 문자열로 있는지 검사한다(S06이 이 파일을 --oracle로 넘긴다).
# 사람이 기준 커밋(b6f9393)의 ReservationService.java를 읽고 적었다. line은 그 파일에서 분기 probe가 있는
# 라인이며(jacoco XML의 cb+mb > 0), 규칙이 "커버됐다"는 것은 arm 귀속 XML에서 그 라인의 cb > 0(분기 하나 이상 실행)이라는 뜻이다.
# description은 소스의 예외 메시지나 주석을 옮기지 않고 따로 쓴 문장이다(번들에 우연히 들어 있을 가능성을 줄인다).
